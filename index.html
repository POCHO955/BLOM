<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLOM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="w-screen h-screen flex flex-col justify-center items-center">

    <!-- Fondo: va justo después de abrir el body -->
    <div class="bg-hex" aria-hidden="true">
        <div class="bg-hex-glow"></div>
        <canvas id="bg-hex-canvas"></canvas>
    </div>

    <main class="w-full h-full flex flex-col justify-center items-center relative">

        <!-- Centerpiece: BLOM Robot -->
        <div id="blom-3d-container" style="width: 350px; height: 400px;"></div>

        <!-- Dialogo -->
        <div class="dialogue-text">
            <p>Texto inicial aquí...</p>
        </div>

        <!-- Juego: Adivina el número -->
        <div id="game-ui" class="hidden mt-8 flex flex-col items-center gap-3">
            <input type="number" id="guess-input"
                class="px-3 py-2 rounded-lg border border-gray-400" placeholder="Tu número..." />
            <button id="guess-button"
                class="px-4 py-2 rounded-lg bg-cyan-500 text-white">Adivinar</button>
        </div>

        <!-- Menu: elegir que juego jugar -->
        <div id="game-menu-ui" class="hidden mt-8 flex flex-col items-center gap-3"></div>

        <!-- Preguntar el nombre -->
        <div id="name-ui" class="hidden mt-8 flex flex-col items-center gap-3">
            <input type="text" id="name-input"
                class="px-3 py-2 rounded-lg border border-gray-400" placeholder="Tu nombre..." />
            <button id="name-button"
                class="px-4 py-2 rounded-lg bg-cyan-500 text-white">Continuar</button>
        </div>

        <!-- Menu: elegir modo de juego -->
        <div id="mode-menu-ui" class="hidden mt-8 flex gap-6"></div>

        <!-- Menu: seguir jugando -->
        <div id="continue-menu-ui" class="hidden mt-8 flex gap-4">
            <button id="continue-yes-button"
                class="px-4 py-2 rounded-lg bg-cyan-500 text-white">Sí, vamos</button>
            <button id="continue-later-button"
                class="px-4 py-2 rounded-lg border border-gray-400">Quizás más tarde</button>
        </div>

    </main>

    <footer
        class="fixed bottom-2 left-3 text-label-code font-label-code opacity-30 hover:opacity-70 transition-opacity">
        BLOM
    </footer>

    <script type="module" src="robot/BLOM3D.js"></script>
    <script src="robot/dialogue.js"></script>
    <script src="storage.js"></script>
    <script src="events.js"></script>
    <script src="fondo-hex.js"></script>
</body>
</html>
